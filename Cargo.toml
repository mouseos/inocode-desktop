[package]
name = "inocode-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
tungstenite = { version = "0", default-features = false, features = ["handshake"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false }
arboard = { version = "3", default-features = false }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
